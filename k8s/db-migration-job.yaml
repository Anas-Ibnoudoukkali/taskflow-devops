apiVersion: batch/v1
kind: Job

metadata:
  name: taskflow-db-migrate

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: 882464895076.dkr.ecr.eu-west-3.amazonaws.com/taskflow-backend:latest

          command: ["alembic", "upgrade", "head"]

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DATABASE_URL

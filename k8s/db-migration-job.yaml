apiVersion: batch/v1
kind: Job

metadata:
  name: taskflow-db-migrate

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: ghcr.io/anas-ibnoudoukkali/taskflow-backend:v1

          command: ["alembic", "upgrade", "head"]

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DATABASE_URL
